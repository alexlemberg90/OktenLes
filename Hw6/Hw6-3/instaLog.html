<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="form">
    <div class="login">
        <img src="Image/insta.png"
             alt="Instagram logo">
        <form>
            <input type="text" name="login" placeholder="Номер телефону, ім'я користувача або email">
            <input type="password" name="password" placeholder="Пароль">
            <input type="submit" value="Увійти">
            <p class="or">АБО</p>
            <p><img class="facebookLogo" src="Image/facebook.png" alt="facebook"> Увійти через фейсбук</p>
            <a href="#">Забули пароль</a>
        </form>
    </div>
    <div class="registration">
        <p>Не маєте облікового запису? <a href="#">Зареєструйтесь</a></p>
    </div>
</div>
</body>
</html>
